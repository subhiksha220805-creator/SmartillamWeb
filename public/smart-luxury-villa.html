<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Smart Luxury Villa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a phone-style control panel floats beside a full-height 3D stage; on narrow screens the stage sits on top and the panel scrolls below. */
:root{
  --ground:#0c1016;
  --paper:#fbfaf7;
  --card:#ffffff;
  --ink:#17191c;
  --ink-2:#6f6a60;
  --line:#e8e3d9;
  --sun:#f5b91e;
  --sun-ink:#201a08;
  --sun-deep:#86600a;
  --focus:#2a6fb0;
  --sky-day:#dcecf8;
  --sky-night:#0b1224;
  --display:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--body);overflow:hidden}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{
  height:100%;display:grid;grid-template-columns:minmax(300px,350px) minmax(0,1fr);
  gap:clamp(16px,3vw,48px);align-items:center;
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 72% 45%,#1b2532 0,#111821 55%,#0a0e14 100%);
}

/* ---------- phone panel ---------- */
.phone{
  position:relative;min-width:0;min-height:0;width:100%;height:min(100%,820px);
  display:flex;flex-direction:column;background:var(--paper);
  border:8px solid #202832;border-radius:40px;overflow:hidden;
  box-shadow:0 0 0 2px #46515d,0 24px 70px #000a;
}
.phone::before{content:"";position:absolute;z-index:6;top:7px;left:50%;transform:translateX(-50%);width:88px;height:20px;border-radius:99px;background:#090d12;pointer-events:none}
.top{flex:none;padding:34px 18px 14px;background:linear-gradient(135deg,#ffc928,#f5b91e);color:var(--sun-ink)}
.top h1{margin:0;font:700 24px/1.05 var(--display);letter-spacing:-.01em;text-wrap:balance}
.top p{margin:6px 0 0;font:500 11px/1.3 var(--mono);letter-spacing:.04em;color:#5a4710;font-variant-numeric:tabular-nums}
.tabs{flex:none;display:flex;gap:6px;overflow-x:auto;padding:10px 14px 8px;scrollbar-width:none;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:500 13px/1 var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--sun)}
.tab[aria-selected="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.pane{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:12px 14px 16px;scrollbar-width:none;background:var(--paper)}
.pane::-webkit-scrollbar{display:none}
.dock{flex:none;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px 12px;border-top:1px solid var(--line);background:var(--paper);padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{font:500 13px/1 var(--body);color:var(--ink-2);background:none;border:0;padding:10px 8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink)}

.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 12px;overflow:hidden;box-shadow:0 3px 12px #3c2d100d}
.sec>h3{margin:0;padding:13px 14px 8px;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--sun-deep)}
.sec>.pad{padding:0 14px 12px}
.row{border-top:1px solid var(--line);padding:0 14px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:11px 0;background:none;border:0;color:var(--ink);cursor:pointer;text-align:left;font:500 14px/1.25 var(--body)}
.sw small{display:block;margin-top:2px;font-weight:400;font-size:12px;color:var(--ink-2)}
.tr{flex:none;width:42px;height:24px;border-radius:999px;background:#e3e1db;border:1px solid #d6d3cb;position:relative;transition:background .18s,border-color .18s}
.tr::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .18s}
.sw[aria-checked="true"] .tr{background:var(--sun);border-color:var(--sun)}
.sw[aria-checked="true"] .tr::after{transform:translateX(18px)}
.ctl{display:grid;gap:10px;padding:0 0 12px}
.ctl[hidden]{display:none}
.rng{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font:500 11px/1 var(--mono);color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.rng output{min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
input[type=range]{width:100%;margin:0;accent-color:var(--sun)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.voice{padding:16px 14px 14px;text-align:center;background:#eaf2fb;border-color:#d6e4f3}
.voice .vhint{margin:0 0 12px;font:500 15px/1.45 var(--body);color:#2c3a52}
.mic{position:relative;width:64px;height:64px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:inline-grid;place-items:center}
.mic svg{width:38px;height:38px;position:relative;z-index:1}
.mic::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#ff6b6b;opacity:0;transform:scale(.8)}
.mic[aria-pressed="true"] svg *{stroke:#fff}
.mic[aria-pressed="true"]::before{opacity:1;animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{0%,100%{transform:scale(.92);box-shadow:0 0 0 0 #ff6b6b66}50%{transform:scale(1);box-shadow:0 0 0 14px #ff6b6b00}}
@media (prefers-reduced-motion:reduce){.mic[aria-pressed="true"]::before{animation:none}}
.voice .vsay{min-height:20px;margin:8px 0 0;font:500 13px/1.4 var(--body);color:#2c3a52}
.voice .vsay.ok{color:#1f7a4a}.voice .vsay.bad{color:#b03a2e}
.vtype{display:flex;gap:6px;margin-top:10px}
.vtype input{flex:1;min-width:0;font:13px var(--body);padding:8px 10px;border:1px solid #c9d8ea;border-radius:10px;background:#fff;color:var(--ink)}
.vtype button{font:600 13px var(--body);padding:8px 12px;border:0;border-radius:10px;background:#2c3a52;color:#fff;cursor:pointer}
.vtry{margin:12px 0 0;font:600 12px var(--body);color:#5a6b85}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.vchips button{font:500 12px var(--body);padding:6px 10px;border:1px solid #c9d8ea;border-radius:999px;background:#fff;color:#2c3a52;cursor:pointer}
.vchips button:hover{border-color:#2c3a52}
.scenes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.scene{font:500 13px/1.2 var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;cursor:pointer;text-align:center;box-shadow:0 3px 12px #3c2d100d}
.scene:hover{border-color:var(--sun)}
.scene[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.scene small{display:block;margin-top:3px;font-weight:400;font-size:11px;opacity:.75}
.room{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 0;background:none;border:0;border-top:1px solid var(--line);cursor:pointer;color:var(--ink);text-align:left;font:500 14px/1.25 var(--body)}
.room:first-of-type{border-top:0}
.room small{display:block;margin-top:2px;font-weight:400;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.room span:last-child{color:var(--ink-2);font-size:18px}
.note{margin:0;padding:0 14px 12px;font-size:12px;color:var(--ink-2)}

/* ---------- 3D stage ---------- */
.stage{position:relative;min-width:0;min-height:0;height:100%;overflow:hidden;border-radius:24px;background:var(--sky-day)}
.sky{position:absolute;inset:0;pointer-events:none}
.sky.day{background:radial-gradient(ellipse at 50% 38%,#eef7fd 0,#dcecf8 55%,#cfe3f3 100%)}
.sky.night{background:radial-gradient(ellipse at 50% 40%,#1c2a4d 0,#0e1730 55%,#070b18 100%);opacity:0}
.stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}
.reset{position:absolute;top:12px;right:12px;font:500 12px/1 var(--body);color:var(--ink);background:#ffffffd9;border:1px solid #ffffffaa;border-radius:999px;padding:9px 13px;cursor:pointer;backdrop-filter:blur(6px)}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);pointer-events:none;font:500 11px/1 var(--mono);letter-spacing:.06em;color:#3b4a5a;background:#ffffffb8;padding:7px 12px;border-radius:999px;white-space:nowrap;transition:opacity .6s}
.hint.gone{opacity:0}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;color:#3b4a5a;text-align:center}

@media (max-width:760px){
  body{overflow:hidden}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,40%);gap:10px;align-items:stretch;padding-block:8px;background:var(--ground)}
  .stage{order:0;border-radius:22px}
  .phone{height:100%;border-width:6px;border-radius:30px}
  .phone::before{top:5px;width:72px;height:16px}
  .top{padding:26px 16px 10px}
  .top h1{font-size:20px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.tr,.tr::after,.hint{transition:none}}
</style>

<main class="app">
  <aside class="phone" aria-label="Smart home controls">
    <header class="top">
      <h1>Smart Luxury Villa</h1>
      <p id="status" aria-live="polite"></p>
    </header>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Rooms"></nav>
    <div class="pane" id="pane"></div>
    <footer class="dock">
      <div class="seg" id="time" role="group" aria-label="Lighting mode">
        <button type="button" data-time="day" aria-pressed="true">Day</button>
        <button type="button" data-time="night" aria-pressed="false">Night</button>
      </div>
      <button class="sw" id="master" type="button" role="switch" aria-checked="true" style="width:auto;padding:0;gap:8px"><span>All lights</span><span class="tr"></span></button>
    </footer>
  </aside>

  <section class="stage" id="stage" aria-label="Interactive 3D model of the villa">
    <div class="sky day"></div>
    <div class="sky night" id="skyNight"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage');
function fail(msg){ stage.insertAdjacentHTML('beforeend','<p class="fail">'+msg+'</p>'); }
if(typeof THREE === 'undefined' || !THREE.OrbitControls){ fail('The 3D library could not be loaded, so the villa cannot be shown.'); return; }
let renderer;
try { renderer = new THREE.WebGLRenderer({antialias:true, alpha:true}); }
catch(e){ fail('This browser could not start WebGL, so the 3D model cannot be shown.'); return; }

const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   STATE
   ===================================================================== */
const DEF = {
  'br1.ceil':{on:true,level:.9}, 'br1.led':{on:true,level:.85}, 'br1.rgb':{on:false,level:.7,hue:270,fx:'steady'},
  'br1.fan':{on:true,speed:1}, 'br1.tv':{on:true,level:.9}, 'br1.spk':{on:true},
  'br2.ceil':{on:true,level:.9}, 'br2.led':{on:true,level:.85}, 'br2.lamp':{on:true,level:.8}, 'br2.rgb':{on:false,level:.7,hue:320,fx:'steady'},
  'br2.fan':{on:true,speed:1},
  'kit.ceil':{on:true,level:.9}, 'kit.pend':{on:true,level:.9}, 'kit.under':{on:true,level:.85},
  'din.light':{on:false,level:.85},
  'liv.ceil':{on:true,level:.9}, 'liv.lamp':{on:true,level:.8}, 'liv.led':{on:true,level:.85}, 'liv.rgb':{on:false,level:.7,hue:220,fx:'steady'},
  'liv.tv':{on:true,level:.9}, 'liv.spk':{on:true}, 'liv.sub':{on:true}, 'liv.fan':{on:true,speed:1},
  'br1.curtain':{on:true,level:1}, 'br2.curtain':{on:true,level:1}, 'kit.curtain':{on:true,level:1}, 'liv.curtain':{on:true,level:1},
  'ent.ceil':{on:true,level:.9}, 'ent.wall':{on:true,level:.9},
  'gar.light':{on:true,level:.9}, 'gar.door':{on:true},
  'out.steps':{on:true,level:.85}, 'out.arch':{on:true,level:.8}, 'gar.gate':{on:false}, 'ent.gate':{on:false}, 'out.garden':{on:true,level:.85}, 'out.glass':{on:true,level:.8}, 'out.wall':{on:true,level:.85},
  'out.pool':{on:true,level:.8,hue:190,fx:'steady'}
};
const clone = o => JSON.parse(JSON.stringify(o));
const st = { night:0, master:true, tone:{kit:'warm',din:'warm'}, scene:'welcome', livMode:'normal', d:clone(DEF) };
const NON_LIGHT = /\.(fan|tv|spk|sub|door|curtain|gate)$/;
const RGB = new Set(['br1.rgb','br2.rgb','liv.rgb','out.pool']);

/* =====================================================================
   RENDERER, CAMERA, ENVIRONMENT
   ===================================================================== */
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;       // the structure is static, so shadow maps are rendered on demand
renderer.shadowMap.needsUpdate = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 500);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI/2 - 0.03;
controls.minDistance = 6; controls.maxDistance = 400;
controls.enabled = false;   // fixed view, no orbit or zoom

function gradCanvas(top, bot){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0,0,0,64);
  gr.addColorStop(0, top); gr.addColorStop(1, bot); g.fillStyle = gr; g.fillRect(0,0,64,64); return c;
}
try {
  const side = gradCanvas('#a9c6e4','#f1f5f9'), topC = gradCanvas('#8fb4dc','#8fb4dc'), botC = gradCanvas('#cdd4db','#cdd4db');
  const cube = new THREE.CubeTexture([side,side,topC,botC,side,side]);
  cube.encoding = THREE.sRGBEncoding; cube.needsUpdate = true;
  scene.environment = new THREE.PMREMGenerator(renderer).fromCubemap(cube).texture;
} catch(e){}

const hemi = new THREE.HemisphereLight(0xe3efff, 0xb9c5d1, .5); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e2, 1);
sun.position.set(18, 30, 24); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-30,right:30,top:30,bottom:-30,near:1,far:120});
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
sun.target.position.set(4, 0, 0);
scene.add(sun, sun.target);

function canvasTexEarly(w,h,draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'),w,h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(50,36),
  new THREE.MeshBasicMaterial({transparent:true,opacity:.35,depthWrite:false,toneMapped:false,map:canvasTexEarly(256,256,(g,w,h)=>{
    const r = g.createRadialGradient(w/2,h/2,w*.18,w/2,h/2,w/2);
    r.addColorStop(0,'rgba(20,30,45,.9)'); r.addColorStop(.6,'rgba(20,30,45,.35)'); r.addColorStop(1,'rgba(20,30,45,0)');
    g.fillStyle = r; g.fillRect(0,0,w,h);
  })}));
shadowPlane.rotation.x = -Math.PI/2; shadowPlane.position.set(3.75,-.93,1.5); shadowPlane.renderOrder = -1; scene.add(shadowPlane);

/* =====================================================================
   HELPERS
   ===================================================================== */
let seed = 11; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
const root = new THREE.Group(); scene.add(root);
const MATS = [];
function M(c, o){ const m = new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.85, metalness:0}, o||{})); MATS.push(m); return m; }
function B(x0,x1,y0,y1,z0,z1,mat,o){
  o = o||{};
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0), mat);
  m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  m.castShadow = o.cast !== false; m.receiveShadow = o.recv !== false;
  (o.p||root).add(m); return m;
}
function CYL(rt,rb,h,x,y,z,mat,o){
  o = o||{};
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,o.seg||20), mat);
  m.position.set(x,y,z); if(o.rx) m.rotation.x = o.rx; if(o.rz) m.rotation.z = o.rz;
  m.castShadow = o.cast !== false; m.receiveShadow = true; (o.p||root).add(m); return m;
}
function canvasTex(w,h,draw,rx,ry){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'),w,h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx||1, ry||1); t.anisotropy = 4; return t;
}
function slatMat(rx, ry){
  return M(0xffffff,{roughness:.6, map:canvasTex(256,256,(g,w,h)=>{
    g.fillStyle='#3d2619'; g.fillRect(0,0,w,h);
    for(let x=0;x<w;x+=16){ g.fillStyle='hsl(22,'+(34+rnd()*8)+'%,'+(30+rnd()*12)+'%)'; g.fillRect(x+2,0,13,h);
      g.fillStyle='rgba(0,0,0,.45)'; g.fillRect(x,0,2,h); }
  }, rx, ry)});
}
function plankMat(rx, ry){
  return M(0xffffff,{roughness:.32, metalness:.02, map:canvasTex(256,256,(g,w,h)=>{
    g.fillStyle = '#b98d5f'; g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=32){ for(let x=0;x<w;x+=128){ const o=(y/32%2)*64;
      g.fillStyle='hsl(30,'+(38+rnd()*8)+'%,'+(52+rnd()*9)+'%)'; g.fillRect((x+o)%w,y,128,32);
      g.fillStyle='rgba(60,35,15,.35)'; g.fillRect((x+o)%w,y,2,32); }
      g.fillStyle='rgba(60,35,15,.4)'; g.fillRect(0,y,w,2); }
  }, rx, ry)});
}
function tileMat(base,grout,rx,ry,rough){
  return M(0xffffff,{roughness:rough||.6, map:canvasTex(128,128,(g,w,h)=>{
    g.fillStyle=base; g.fillRect(0,0,w,h); g.fillStyle=grout; g.fillRect(0,0,w,3); g.fillRect(0,0,3,h);
    for(let i=0;i<60;i++){ g.fillStyle='rgba(255,255,255,'+(rnd()*.06)+')'; g.fillRect(rnd()*w,rnd()*h,rnd()*30,rnd()*30); }
  }, rx, ry)});
}

const white = M(0xf5f6f8,{roughness:.92});
const lgrey = M(0xdfe2e6,{roughness:.9});
const mgrey = M(0xc8cdd3,{roughness:.85});
const black = M(0x14171b,{roughness:.4, metalness:.55});
const glassMat = new THREE.MeshPhysicalMaterial({color:0xcfe4f2, transparent:true, opacity:.13, roughness:.03, metalness:0, side:THREE.DoubleSide, depthWrite:false});

/* ---------- light registry: every light group is driven by one entry in st.d ---------- */
const REG = {}; let cur = null;
const OFFC = new THREE.Color(0x2c3036);
function G(id){
  if(!REG[id]) REG[id] = {id, leds:[], lights:[], glows:[], v:(DEF[id]&&DEF[id].on?DEF[id].level:0), rgb:RGB.has(id), tone:id.startsWith('kit.')?'kit':id.startsWith('din.')?'din':null};
  cur = REG[id]; return cur;
}

  const t=.07;

  B(x0,x0+t,y0,y1,z-.04,z+.04,black); B(x1-t,x1,y0,y1,z-.04,z+.04,black);
  (mulls||[]).forEach(mx=>B(mx-t/2,mx+t/2,y0,y1,z-.04,z+.04,black));
  const g = new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,y1-y0), glassMat);

function sideGlass(z0,z1,y0,y1,x,mulls){
  const t=.07;
  B(x-.04,x+.04,y0,y0+t,z0,z1,black); B(x-.04,x+.04,y1-t,y1,z0,z1,black);

const TVS = [];
function drawTV(g,w,h,variant,hi){
  const gr = g.createLinearGradient(0,0,w,h); gr.addColorStop(0,'#0a1a4a'); gr.addColorStop(1,'#241047');
  g.fillStyle = gr; g.fillRect(0,0,w,h);
  g.fillStyle='rgba(255,255,255,.85)'; g.fillRect(24,18,44,8); g.fillRect(w-120,18,96,8);
  g.fillStyle='#2f6bff'; g.fillRect(24,44,210,96);
  g.fillStyle='#d6407a'; g.fillRect(244,44,100,96); g.fillStyle='#f2a24a'; g.fillRect(354,44,134,96);
  for(let r=0;r<2;r++) for(let i=0;i<5;i++){
    g.fillStyle='hsl('+((i*57+r*130+variant*40)%360)+',60%,'+(38+r*8)+'%)';
    g.fillRect(24+i*94,160+r*62,84,52);

  const k = hi % 10, hx = 24+(k%5)*94, hy = 160+Math.floor(k/5)*62;
  g.strokeStyle='#ffffff'; g.lineWidth=4; g.strokeRect(hx-3,hy-3,90,58);
}
function tv(id,cx,cy,z,w,h,variant){

function plant(x,z,s,y0){
  const g = new THREE.Group(); g.position.set(x,y0===undefined?.35:y0,z); root.add(g);
  CYL(.17*s,.13*s,.42*s,0,.21*s,0,M(0x2c2f34,{roughness:.5}),{p:g});

    const c = new THREE.Mesh(new THREE.ConeGeometry(.07*s,h,5), leaf);

function chair(x,z,ry){

  [[-.19,-.19],[.19,-.19],[-.19,.19],[.19,.19]].forEach(p=>B(p[0]-.015,p[0]+.015,0,.44,p[1]-.015,p[1]+.015,wd,{p:g}));

function curtain(ax,y0,y1,az,len,rotY,color){
  const g = new THREE.Group(); g.position.set(ax,0,az); g.rotation.y = rotY; root.add(g);
  // fine woven-fabric texture (thread lines + slight noise), tinted by the material colour
  const tex = canvasTex(128,128,(c,w,h)=>{
    c.fillStyle = '#f2f2f2'; c.fillRect(0,0,w,h);
    for(let i=0;i<w;i+=2){ c.fillStyle = 'rgba(0,0,0,'+(.05+rnd()*.07)+')'; c.fillRect(i,0,1,h); }
    for(let j=0;j<h;j+=2){ c.fillStyle = 'rgba(255,255,255,'+(.05+rnd()*.08)+')'; c.fillRect(0,j,w,1); }
  }, len/.35, (y1-y0)/.35);
  // pleated drape: real wave geometry (S-fold pleats that taper and sway with height)
  const H = y1-y0, segX = Math.max(60,Math.ceil(len/.025)), segY = 28;
  const geo = new THREE.PlaneGeometry(len,H,segX,segY);
  const pos = geo.attributes.position, pleat = .3, ph = rnd()*6.28;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), y = pos.getY(i), t = (H/2 - y)/H;          // t: 0 at rod, 1 at hem
    const k = (x + len/2) / pleat * Math.PI*2;
    const sway = .55*Math.sin(y*1.7 + ph) + .25*Math.sin(x*3.1 + y*2.3);
    const amp = .035 + .03*t;                                            // folds open up toward the hem
    const z = amp*Math.sin(k + sway) + .012*Math.sin(k*2.3 + y*4.0);
    pos.setZ(i, z);
    if(t > .9) pos.setY(i, y - .012*Math.sin(k + sway)*(t-.9)*10);       // softly scalloped hem
  }
  geo.computeVertexNormals();
  const mat = M(color,{roughness:.92,map:tex,side:THREE.DoubleSide});
  const m = new THREE.Mesh(geo, mat);
  m.position.set(len/2,(y0+y1)/2,0); m.castShadow = true; m.receiveShadow = true; g.add(m);
  // header band at the top hides the pleat start
  B(0,len,y1-.1,y1,-.045,.045,M(color,{roughness:.95}),{p:g,cast:false});
  g.scale.x = .22; g.userData.len = len;
  return g;
}

(function(){

  function prof(keys){
    const N=400, z0=-2.3, z1=2.3, a=[];

      const z=z0+(z1-z0)*i/N; let v=keys[keys.length-1][1];

    }
    for(let p=0;p<8;p++){ const b=a.slice(); for(let i=1;i<N;i++) a[i]=(b[i-1]+2*b[i]+b[i+1])/4; }
    return z=>{ const f=(Math.max(z0,Math.min(z1,z))-z0)/(z1-z0)*N, i=Math.min(N-1,Math.floor(f)); return a[i]+(a[i+1]-a[i])*(f-i); };

  const YB = prof([[-2.3,.44],[-2.2,.33],[-1.9,.27],[1.9,.27],[2.2,.29],[2.3,.34]]);           // underside
  const YS = prof([[-2.3,.9],[-2.1,.99],[-1.6,1.0],[.9,.99],[1.6,.9],[2.0,.82],[2.3,.7]]);     // belt / hood / deck line
  const H  = prof([[-2.3,0],[-1.7,0],[-1.1,.2],[-.55,.43],[.1,.46],[.4,.43],[.8,.2],[1.0,0],[2.3,0]]); // cabin height
  const FX=[.9,.86,.8,.66,.4,0], GX=[0,.1,.25,.5,.2,0], FY=[0,.3,.75,.96,1,1], CR=[.012,.014,.018,.022,.03,.04];
  function half(z){

    const a=s*RN+i, b=a+1, c=a+RN, d=c+1; ind.push(a,b,c, b,d,c);
  }
  [[NZ,1],[0,-1]].forEach(([s,dir])=>{                  // end caps
    const base=pos.length/3, z=s?2.3:-2.3, hp=half(z), cy=(YB(z)+YS(z))/2;
    pos.push(0,cy,z); uv.push(.5,.5);

  // paint texture: body colour, black skirts, glass, shut lines
  const tex = canvasTexEarly(2048,1024,(c,w,h)=>{

// irregular rounded blobs with smooth normals: the building block for shrubs and canopies
function blobGeo(detail,amp){
  const g = new THREE.IcosahedronGeometry(1,detail), pos = g.attributes.position, nor = g.attributes.normal, v = new THREE.Vector3(), cache = {};
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i);
    const key = v.x.toFixed(3)+','+v.y.toFixed(3)+','+v.z.toFixed(3);
    if(!(key in cache)) cache[key] = 1+(rnd()-.5)*amp;
    nor.setXYZ(i,v.x,v.y,v.z);
    v.multiplyScalar(cache[key]); pos.setXYZ(i,v.x,v.y,v.z);
  }
  return g;
}

}

const cWarm = new THREE.Color(0xffbf73), cCool = new THREE.Color(0xe2ecff);
const lWarm = new THREE.Color(0xffc27a), lCool = new THREE.Color(0xdbe8ff);
const tmpC = new THREE.Color(), tmpL = new THREE.Color();
let nightK = 0, envDirty = true, lastNight = -1;

function hueOf(s,off,t){ return s.fx === 'cycle' ? ((t*.06 + off) % 1) : (s.hue/360); }
function updateGroups(dt,t){
  const boost = .8 + .55*nightK, glowBoost = .65 + .9*nightK;
  for(const id in REG){
    const g = REG[id], s = st.d[id]; if(!s) continue;
    const target = (st.master && s.on) ? s.level : 0;
    g.v += (target - g.v) * Math.min(1, dt*6);
    const v = g.v, lit = v > .01;
    const fxm = (g.rgb && s.fx === 'breathe') ? .55 + .45*Math.sin(t*2.2) : 1;
    const cool = g.tone && st.tone[g.tone] === 'cool';
    for(const l of g.leds){
      if(!lit){ l.mat.color.copy(OFFC); continue; }
      if(g.rgb) tmpC.setHSL(hueOf(s,l.off,t),.9,.55); else tmpC.copy(cool ? cCool : cWarm);
      l.mat.color.copy(OFFC).lerp(tmpC, Math.min(1, v*fxm*l.gain));
    }
    for(const li of g.lights){
      if(g.rgb) li.l.color.setHSL(hueOf(s,0,t),.9,.55); else li.l.color.copy(cool ? lCool : lWarm);
      li.l.intensity = lit ? li.base*v*fxm*boost : 0;
    }
    for(const gl of g.glows){
      gl.sp.visible = lit;
      if(!lit) continue;
      if(g.rgb) gl.sp.material.color.setHSL(hueOf(s,gl.off,t),1,.55); else gl.sp.material.color.copy(cool ? cCool : cWarm);
      gl.sp.material.opacity = gl.op*v*fxm*glowBoost;
    }
  }
  // pool water takes the colour of the underwater lights
  const ps = st.d['out.pool'], pg = REG['out.pool'];
  if(pg.v > .01){
    tmpC.setHSL(hueOf(ps,0,t),.9,.55);
    water.material.emissive.copy(tmpC).multiplyScalar(.12 + .45*pg.v*(ps.fx==='breathe' ? .55+.45*Math.sin(t*2.2) : 1));
  } else water.material.emissive.setRGB(0,0,0);
}
function updateDevices(dt,t){
  const speeds = [2.2,5.5,10.5];
  for(const f of FANS){
    const s = st.d[f.id], target = s.on ? speeds[s.speed] : 0;
    f.w += (target - f.w) * Math.min(1, dt*1.1);
    f.rot.rotation.y += f.w * dt;
  }
  for(const r of TVS){
    const s = st.d[r.id], target = s.on ? .3 + .7*s.level : .035;
    const c = r.mat.color; c.r += (target-c.r)*Math.min(1,dt*8); c.g = c.b = c.r;
    r.halo.visible = c.r > .1;
    r.halo.material.color.setRGB(.42,.55,1);
    r.halo.material.opacity = s.on ? .16*s.level*(.7+.6*nightK) : 0;
    if(s.on && !reduced && t > r.next){ r.hi++; r.next = t + 3.2; drawTV(r.g,512,288,r.variant,r.hi); r.tex.needsUpdate = true; }
  }
  SPKS.forEach((r,i)=>{
    const s = st.d[r.id]; const on = !!(s && s.on);
    const tvOn = r.tv ? st.d[r.tv].on : false;
    const act = on ? (tvOn ? 1 : .12) : 0;
    r.leds.forEach(m=>m.color.setHex(on ? (tvOn ? 0x4dffb0 : 0x2a8f66) : 0x2c3036));
    r.cones.forEach((m,j)=>{
      const p = reduced ? 0 : .5 + .5*Math.sin(t*(r.sub ? 9 : 15) + j*1.7 + i);
      m.scale.y = 1 + act*1.3*p; m.scale.x = m.scale.z = 1 + act*.05*p;
    });
  });
  // curtains
  for(const c of CURTS){
    const d = st.d[c.id], target = d.on ? d.level : 0;
    c.k = reduced ? target : c.k + (target - c.k) * Math.min(1, dt*2.2);
    for(const x of c.gs) x[0].scale.x = x[1] + (.22 - x[1]) * c.k;
  }
  // garage door
  DOOR.target = st.d['gar.door'].on ? 0 : 1;
  if(DOOR.k !== DOOR.target){
    const step = dt/2.4;
    DOOR.k = reduced ? DOOR.target : (DOOR.k < DOOR.target ? Math.min(DOOR.target, DOOR.k+step) : Math.max(DOOR.target, DOOR.k-step));
    DOOR.group.scale.y = .06 + .94*DOOR.k;
    if(DOOR.k === DOOR.target) renderer.shadowMap.needsUpdate = true;
  }
  // compound gates swing inward on their pillar hinges
  for(const g of GATES){
    const target = st.d[g.id].on ? 1 : 0;
    if(g.k !== target){
      const step = dt/1.8;
      g.k = reduced ? target : (g.k < target ? Math.min(target,g.k+step) : Math.max(target,g.k-step));
      const a = ease(g.k)*1.65;
      g.leaves.forEach(l=>{ l.g.rotation.y = l.sgn*a; });
      if(g.k === target) renderer.shadowMap.needsUpdate = true;
    }
  }
  // pool ripples
  rippleTex.offset.x += dt*.012; rippleTex.offset.y += dt*.006;
}
function updateTime(dt){
  const target = st.night;
  nightK = reduced ? target : nightK + (target - nightK) * Math.min(1, dt*2.4);
  if(Math.abs(target - nightK) < .002) nightK = target;
  if(nightK === lastNight) return; lastNight = nightK;
  const k = nightK;
  hemi.intensity = .5 - .34*k;
  sun.intensity = 1 - .86*k;
  sun.color.setHex(k > .5 ? 0x8fa8ff : 0xfff3e2);
  hemi.color.setHex(k > .5 ? 0x7f93c9 : 0xe3efff);
  renderer.toneMappingExposure = .62 + .2*k;
  shadowPlane.material.opacity = .35 + .3*k;
  MATS.forEach(m=>{ m.envMapIntensity = .35 - .2*k; });
  $('#skyNight').style.opacity = String(k);
}

        if(k === 'spk' && /\b(?:sub ?)?woofers?\b/.test(t) && !/\b(speakers?|sound|home theat|audio|music)\b/.test(t)) ids = ids.filter(id=>id.endsWith('.sub'));
        if(k === 'gate'){ if(walk && !drive) ids = ids.filter(id=>id === 'ent.gate'); else if(drive && !walk) ids = ids.filter(id=>id === 'gar.gate'); }
        if(ids.length) groups.push({k, ids, plural: ids.length > 1 || /s$/.test(NAMES[ids[0]])});
      });
      const roomNames = rooms.map(r=>r[0]);
      const inPh = roomNames.length ? (roomNames.length === 1 && /^(outdoors|upstairs|downstairs)$/.test(roomNames[0]) ? ' '+roomNames[0] : ' in '+join(roomNames)) : '';
      const klab = k => k === 'light' && colourIntent ? 'colour lights' : KLABEL[k];
      const has = k => groups.some(g=>g.k === k);
      const levelGroup = has('light') || has('tv') || has('curtain');

      if(isQuery){
        if(!groups.length){
          const cnt = k => ALL.filter(id=>kindOf(id) === k && st.d[id].on).length;
          return {ok:1, msg:()=>cnt('light')+' lights, '+cnt('fan')+' fans and '+cnt('tv')+' TVs are on. The garage door is '+(st.d['gar.door'].on ? 'open' : 'closed')+'.'};
        }
        const howMany = /\bhow many\b/.test(t);
        return {ok:1, msg:()=>groups.map(g=>{
          const on = g.ids.filter(id=>st.d[id].on).length, n = g.ids.length, op = OPENK.has(g.k), w = op ? 'open' : 'on';
          if(howMany) return on === 0 ? 'No '+KLABEL[g.k]+' are '+w+inPh+'.' : on+' '+(on === 1 ? SING[g.k] : KLABEL[g.k])+inPh+' '+(on === 1 ? 'is' : 'are')+' '+w+'.';
          if(n > 3) return on+' of '+n+' '+KLABEL[g.k]+inPh+' '+(on === 1 ? 'is' : 'are')+' '+w+'.';
          return g.ids.map(id=>NAMES[id]+' '+(/s$/.test(NAMES[id]) ? 'are' : 'is')+' '+stateWord(id,st.d[id].on)).join(', ')+'.';
        }).join(' ').replace(/^./,x=>x.toUpperCase())};
      }

      // what to do
      const ops = {};
      let act = actOf(t);
      const fanG = has('fan');
      if(fanG){
        const sp = /\b(low|slow|lowest|minimum|min)\b/.test(t) ? 0 : /\b(medium|mid|moderate|normal)\b/.test(t) ? 1 : /\b(high|fast|highest|maximum|max|full)\b/.test(t) ? 2 : null;
        const sn = t.match(/\bspeed\s*(?:to|at)?\s*([123])\b/) || (!levelGroup && t.match(/\b(?:to|at)\s*([123])\b/));
        if(sn) ops.speed = +sn[1]-1; else if(sp !== null && !/\b(low|medium|high)\s+brightness\b/.test(t)) ops.speed = sp;
        else if(/\b(faster|speed up|increase|higher|raise|turn up)\b/.test(t)) ops.speedRel = 1;
        else if(/\b(slower|slow down|decrease|reduce|lower|turn down)\b/.test(t)) ops.speedRel = -1;
      }
      if(levelGroup){
        let lv = null;
        const nm = t.match(/\b(\d{1,3})\s*percent\b/) || t.match(/\b(?:to|at|level|brightness)\s+(\d{1,3})\b/);
        if(nm) lv = +nm[1];
        else { const w = t.match(/\b(ten|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred)\s*percent\b/);
          if(w) lv = PCTW[w[1]]; else if(/\bhalf(way)?\b/.test(t)) lv = 50; else if(/\bquarter\b/.test(t)) lv = 25;
          else if(/\b(full|maximum|max|brightest)\b/.test(t) && !(fanG && !has('light') && !has('tv'))) lv = 100;
          else if(/\b(minimum|min|lowest|dimmest)\b/.test(t)) lv = 10;
          else { const bw = t.match(/\b(low|medium|high)\s+brightness\b|\bbrightness\s+(low|medium|high)\b/); if(bw) lv = {low:30,medium:60,high:100}[bw[1] || bw[2]]; } }
        if(lv !== null){ if(lv <= 0) act = 'off'; else ops.level = clamp(lv,10,100)/100; }
        else if(has('light')){
          if(/\b(brighten|brighter|increase|raise|turn up|higher|more light)\b/.test(t)) ops.levelRel = .3;
          else if(/\b(dim|dimmer|darker|decrease|reduce|lower|turn down|less light)\b/.test(t)) ops.levelRel = -.3;
        }
      }
      if(colourIntent && has('light')){ if(colour) ops.hue = colour[1]; if(fxw) ops.fx = fxw; }
      let toneKeys = [];
      if(tone){
        toneKeys = rooms.length ? [rooms.some(r=>r[1]('kit.ceil')) ? 'kit' : null, rooms.some(r=>r[1]('din.light')) ? 'din' : null].filter(Boolean) : ['kit','din'];
        if(!toneKeys.length) return {ok:0, msg:()=>'Only the kitchen and dining lights can change between warm and cool.'};
        ops.tone = tone;
      }
      const hasValue = ['speed','speedRel','level','levelRel','hue','fx','tone'].some(k=>ops[k] !== undefined);
      if(!act && !hasValue && prev && prev.act && groups.length) act = prev.act;

      if(!groups.length && !ops.tone){
        if(T.size) return {ok:0, msg:()=>rooms.length ? 'There are no '+klab([...T][0])+inPh+'.' : 'I could not find any '+klab([...T][0])+'.'};
        return {ok:0, msg:()=>'Sorry, I did not get that. Try “turn off all fans”, or say “help”.'};
      }
      if(!act && !hasValue) return {ok:0, msg:()=>'Do you want the '+(groups.map(g=>KLABEL[g.k]).join(' and '))+' on or off?'};

      const apply = ()=>{
        if(ops.tone) toneKeys.forEach(k=>{ st.tone[k] = ops.tone; });
        groups.forEach(g=>{
          let a = act;
          if(a === 'toggle') a = g.ids.every(id=>st.d[id].on) ? 'off' : 'on';
          const anyOn = g.ids.some(id=>st.d[id].on);
          if(g.k === 'light') st.master = true;
          g.ids.forEach(id=>{
            const s = st.d[id];
            if(a) s.on = a === 'on';
            if(g.k === 'fan'){
              if(ops.speed !== undefined){ s.speed = ops.speed; if(!a) s.on = true; }
              else if(ops.speedRel){ s.speed = clamp(s.speed+ops.speedRel,0,2); if(!a) s.on = true; }
            }
            if(g.k === 'light' || g.k === 'tv' || g.k === 'curtain'){
              if(ops.level !== undefined){ s.level = ops.level; if(!a && (s.on || !anyOn)) s.on = true; }
              else if(ops.levelRel && g.k === 'light'){ s.level = clamp((s.level || .9)+ops.levelRel,.1,1); if(ops.levelRel > 0 && !a && (s.on || !anyOn)) s.on = true; }
            }
            if(g.k === 'light' && RGB.has(id)){
              if(ops.hue !== undefined){ s.hue = ops.hue; s.fx = 'steady'; if(!a) s.on = true; }
              if(ops.fx){ s.fx = ops.fx; if(!a) s.on = true; }
            }
          });
        });
      };
      const generic = roomNames.length > 0 && groups.length > 1;
      const sfx = generic ? inPh : '';
      const phrase = g => {
        if(!generic && g.ids.length === 1) return NAMES[g.ids[0]];
        const lab = g.k === 'light' && subs.length === 1 ? subs[0][0] : (g.k === 'spk' && /\b(?:sub ?)?woofers?\b/.test(t) && !/\bspeakers?\b/.test(t) ? 'subwoofers' : klab(g.k));
        return generic ? lab : roomNames.length ? lab+inPh : (g.ids.length > 1 ? 'all ' : '')+lab;
      };
      const msg = fut => {
        const when = fut ? ' in '+delayTxt : '';
        const be = pl => fut ? 'will be' : (pl ? 'are' : 'is');
        let body;
        if(hasValue){
          body = groups.map(g=>{
            let d = '';
            if(g.k === 'fan'){ if(ops.speed !== undefined) d = 'set to '+['low','medium','high'][ops.speed]; else if(ops.speedRel) d = ops.speedRel > 0 ? 'sped up' : 'slowed down'; }
            else if(g.k === 'light' || g.k === 'tv' || g.k === 'curtain'){
              if(ops.hue !== undefined || ops.fx){ d = ops.fx === 'cycle' ? 'set to colour cycle' : ops.fx === 'breathe' ? 'set to breathe' : ops.hue !== undefined ? 'set to '+colour[2] : 'set to steady'; }
              else if(ops.level !== undefined) d = 'set to '+Math.round(ops.level*100)+' percent';
              else if(ops.levelRel && g.k === 'light') d = ops.levelRel > 0 ? 'brightened' : 'dimmed';
            }
            if(!d && act) d = OPENK.has(g.k) ? (act === 'off' ? 'closed' : 'open') : 'turned '+(act === 'toggle' ? 'over' : act);
            return d ? phrase(g)+sfx+' '+be(g.plural || generic)+' '+d : null;
          }).filter(Boolean);
          if(ops.tone) body.unshift('the '+join(toneKeys.map(k=>k === 'kit' ? 'kitchen' : 'dining'))+' lights '+be(true)+' set to '+ops.tone+' white');
          body = join(body);
        } else {
          const dev = groups.filter(g=>!OPENK.has(g.k)), opn = groups.filter(g=>OPENK.has(g.k));
          const verb = act === 'toggle' ? 'toggled' : 'turned '+act;
          const bits = [];
          if(dev.length) bits.push(join(dev.map(phrase))+sfx+' '+be(dev.length > 1 || dev[0].plural)+' '+verb);
          if(opn.length) bits.push(join(opn.map(phrase))+sfx+' '+be(opn.length > 1 || opn[0].plural)+' '+(act === 'toggle' ? 'toggled' : act === 'on' ? 'open' : 'closed'));
          body = bits.join(' and ');
        }
        return 'Okay, '+body+when+'.';
      };
      return {ok:1, act: act === 'toggle' ? null : act, delay, delayTxt, apply, msg};
    }

    function run(raw){
      let prev = null; const rs = [];
      splitCmd(raw).forEach(p=>{ const r = resolve(p, prev); if(r){ rs.push(r); if(r.act) prev = {act:r.act}; } });
      if(!rs.length) return null;
      if(!rs.some(r=>r.ok)) return {ok:0, msg:rs[0].msg(false)};
      const msgs = [];
      rs.forEach(r=>{
        if(!r.ok){ msgs.push(r.msg(false)); return; }
        if(r.delay){
          const id = setTimeout(()=>{ if(r.apply) r.apply(); syncAll(); const m = r.msg(false); show(m,'ok'); speak(m); const i = timers.indexOf(id); if(i >= 0) timers.splice(i,1); }, r.delay);
          timers.push(id); msgs.push(r.msg(true));
        } else { if(r.apply) r.apply(); msgs.push(r.msg(false)); }
      });
      syncAll();
      return {ok:1, msg:msgs.map((m,i)=> i ? m.replace(/^Okay, /,'').replace(/^./,x=>x.toUpperCase()) : m).join(' ')};
    }
    function handle(raw){
      show('“'+raw+'”');
      const r = run(raw); if(!r) return;
      show(r.msg, r.ok ? 'ok' : 'bad'); speak(r.msg);
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null, live = false;
    mic.addEventListener('click',()=>{
      if(live && rec){ rec.stop(); return; }
      if(!SR){ show('Voice input is not supported in this browser. Please type the command below.','bad'); box.focus(); return; }
      try{
        rec = new SR(); rec.lang = 'en-IN'; rec.interimResults = true; rec.maxAlternatives = 1; let finalTxt = '', lastTxt = '';
        rec.onstart = ()=>{ live = true; mic.setAttribute('aria-pressed','true'); show('Listening\u2026'); };
        rec.onresult = e=>{ let tmp = ''; for(let i=e.resultIndex;i<e.results.length;i++){ const r = e.results[i]; if(r.isFinal) finalTxt += r[0].transcript+' '; else tmp += r[0].transcript; } lastTxt = (finalTxt + tmp).trim(); if(lastTxt) show('\u201c'+lastTxt+'\u201d'); };
        rec.onerror = e=>{ show(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'Microphone is blocked here. Allow mic access, or type the command below.' : e.error === 'no-speech' ? 'I did not hear anything. Tap the mic and try again.' : 'Voice input failed ('+e.error+'). You can type the command below.','bad'); };
        rec.onend = ()=>{ live = false; mic.setAttribute('aria-pressed','false'); const spoken = finalTxt.trim() || lastTxt; if(spoken) handle(spoken); };
        rec.start();
      }catch(err){ live = false; show('Could not start the microphone. Please type the command below.','bad'); }
    });
    const typed = ()=>{ const v = box.value.trim(); if(v){ handle(v); box.value = ''; } };
    go.addEventListener('click',typed); box.addEventListener('keydown',e=>{ if(e.key === 'Enter') typed(); });
    ['Turn off all fans','Turn on all fans','Turn off all lights','Living room lights off','Set pool lights to blue','Dim bedroom 1 lights','Close all curtains','Open garage door','Turn off TV in 10 minutes','How many lights are on','Good night'].forEach(x=>{ const b = el('button',null,x); b.type = 'button'; b.addEventListener('click',()=>handle(x)); vs.querySelector('.vchips').appendChild(b); });
    p.insertBefore(vs, p.firstChild); vs.style.marginBottom = '12px';
  })();
  const sec = el('section','sec'); sec.appendChild(el('h3',null,'Rooms'));
  const list = el('div','pad');
  GROUPS.forEach(g=>{
    const b = el('button','room'); b.type = 'button';
    b.innerHTML = '<span><span class="nm"></span><small></small></span><span aria-hidden="true">›</span>';
    b.querySelector('.nm').textContent = g[1];
    b.addEventListener('click',()=>selectTab(g[2]));
    list.appendChild(b);
    const small = b.querySelector('small');
    SYNCS.push(()=>{ const c = counts(g[0]); const parts = [plural(c.lights,'light')+' on']; if(c.fans) parts.push(plural(c.fans,'fan')); if(c.tvs) parts.push('TV on'); small.textContent = parts.join(' · '); });
  });
  sec.appendChild(list); p.appendChild(sec);
  const cs = el('section','sec'); cs.appendChild(el('h3',null,'Curtains'));
  const cp = el('div','pad');
  const CK = ['br1.curtain','br2.curtain','kit.curtain','liv.curtain'];
  cp.appendChild(seg([['open','Open all'],['close','Close all']],()=>CK.every(k=>st.d[k].on)?'open':(CK.every(k=>!st.d[k].on)?'close':''),v=>{ CK.forEach(k=>{ st.d[k].on = v === 'open'; }); },'All curtains'));
  cs.appendChild(cp); p.appendChild(cs);
  p.appendChild(el('p','note','Pick a room to control its lights, fans, TV and speakers. Day and Night change the sky and how strongly the lights show.'));
})();

const tabsEl = $('#tabs'), paneEl = $('#pane'); paneEl.setAttribute('role','tabpanel');
function selectTab(id){
  TABS.forEach(t=>{ const b = document.getElementById('tab-'+t.id); b.setAttribute('aria-selected', String(t.id === id)); b.tabIndex = t.id === id ? 0 : -1; });
  paneEl.replaceChildren(panes[id]); paneEl.scrollTop = 0;
  const tb = TABS.find(t=>t.id === id); if(tb){ curView = tb.view; goTo(curView); }
}
TABS.forEach(t=>{
  const b = el('button','tab',t.label); b.type = 'button'; b.id = 'tab-'+t.id; b.setAttribute('role','tab');
  b.addEventListener('click',()=>selectTab(t.id)); tabsEl.appendChild(b);
});

  st.night = b.dataset.time === 'night' ? 1 : 0;
  document.querySelectorAll('#time button').forEach(c=>c.setAttribute('aria-pressed', String(c === b)));
}));
// "All lights" works on the individual light states (never a hidden global block),
// so a single light can always be switched on again after everything was turned off.
const lightIds = () => Object.keys(st.d).filter(k=>!NON_LIGHT.test(k) && k !== 'din.light');
const anyLightOn = () => lightIds().some(k=>st.d[k].on);
$('#master').addEventListener('click',()=>{
  st.master = true;
  const turnOn = !anyLightOn();
  lightIds().forEach(k=>{ st.d[k].on = turnOn; });
  syncAll();
});
SYNCS.push(()=>$('#master').setAttribute('aria-checked', String(anyLightOn())));

/* =====================================================================
   SIZING + LOOP
   ===================================================================== */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight; if(!w || !h) return;
  renderer.setSize(w,h,false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
  goTo(curView, true);
}
new ResizeObserver(resize).observe(stage);

selectTab('home');
syncAll();
resize(); goTo('iso', true);

const clock = new THREE.Clock(); let T = 0;
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05); T += dt;
  if(tw){
    const k = Math.min(1,(performance.now()-tw.t0)/tw.dur), e = ease(k);
    camera.position.lerpVectors(tw.p0,tw.p1,e); controls.target.lerpVectors(tw.g0,tw.g1,e);
    if(k >= 1) tw = null;
  }
  updateTime(dt); updateGroups(dt,T); updateDevices(dt,T);
  controls.update();
  renderer.render(scene,camera);
}
loop();
})();
